<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flipper Remote plugin test page</title>
<style>
  body { margin: 0; background: #0e141b; color: #dcdedf; font: 14px/1.4 "Noto Sans", sans-serif; }
  .screen { display: flex; height: 100vh; }
  .page { flex: 1; position: relative; overflow: hidden; background: #171d25; }
  .qam { width: 320px; background: #23262e; overflow-y: auto; padding: 8px 12px; box-sizing: border-box; order: 2; }
  .qam-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 16px; padding: 6px 0; }
  .panel-section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; opacity: .7; margin: 14px 0 6px; }
  .panel-row { margin: 6px 0; }
  .dlg-button { display: block; width: 100%; background: #3d4450; color: #fff; border: 0; border-radius: 3px; padding: 8px 12px; font: inherit; cursor: pointer; }
  .dlg-button:disabled { opacity: .45; cursor: default; }
  .dlg-button:focus { outline: 2px solid #fff; }
  .item .label { font-size: 12px; opacity: .8; margin-bottom: 4px; display: block; }
  .dropdown { width: 100%; padding: 6px; background: #3d4450; color: #fff; border: 0; }
  #toasts { position: fixed; bottom: 8px; left: 8px; margin: 0; padding: 0; list-style: none; max-width: 40%; }
  #toasts li { background: #3b2f1e; padding: 4px 8px; margin-top: 4px; font-size: 12px; }
  .home { padding: 60px 40px; opacity: .5; }
  .modal-layer { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: flex; align-items: center; justify-content: center; }
  .modal-root { background: #2a2f38; padding: 24px 28px; border-radius: 6px; box-shadow: 0 8px 40px rgba(0, 0, 0, .6); }
</style>
</head>
<body>
<div id="root"></div>
<script src="/static/react.js"></script>
<script src="/static/react-dom.js"></script>
<script src="/static/standins.js"></script>
<script type="module">
  import plugin from "/static/index.js";
  window.harness.start(plugin);
  window.harnessReady = true;
</script>
</body>
</html>
